# SPDX-License-Identifier: GPL-3.0-or-later
# The website (site/) on GitHub Pages at https://ps5term.phantomptr.com/, the same way as
# PS5Upload's. The page reads the newest release from GitHub's API in the visitor's browser,
# so a release shows up without a deploy.
#
# It deploys when site/ (or this file, or the translation check) changes on main, and by hand
# (Actions → pages → Run workflow).

name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/site-i18n.mjs", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          check-latest: true
      - name: Every language has every string
        run: node scripts/site-i18n.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
